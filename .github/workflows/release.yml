name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Release Notes from CHANGELOG
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          echo "Extracting release notes for $TAG..."
          
          python3 -c '
          import re, os
          tag = os.environ.get("TAG", "")
          filepath = "docs/en/CHANGELOG.md"
          if os.path.exists(filepath):
              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()
              pattern = r"##\s*\[?" + re.escape(tag) + r"\]?.*?\n(.*?)(?=\n##\s*\[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  with open("release_notes.md", "w", encoding="utf-8") as out:
                      out.write(notes)
                  print("Extracted notes successfully.")
                  exit(0)
          print("No changelog section found.")
          '
          if [ -f release_notes.md ] && [ -s release_notes.md ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Prepare Detailed Release Body
        run: |
          cat << 'EOF' > FULL_RELEASE_NOTES.md
          ## 🚀 Fluint ${{ github.ref_name }}

          Welcome to **Fluint ${{ github.ref_name }}**! **Fluint** is an open-source, high-performance Terminal User Interface (TUI) engine for Go built from scratch, prioritizing zero-allocation hot paths and smooth discrete cell animations.

          ---

          ### 📋 Release Summary

          EOF

          if [ "${{ steps.changelog.outputs.has_notes }}" = "true" ]; then
            cat release_notes.md >> FULL_RELEASE_NOTES.md
          else
            echo "- See commit history and documentation for changes in this tag." >> FULL_RELEASE_NOTES.md
          fi

          cat << 'EOF' >> FULL_RELEASE_NOTES.md

          ---

          ### 🏗️ Technical & Architectural Highlights

          - **Zero-Allocation Hot Path:** Zero memory allocations during event dispatching, ANSI escape parsing, and frame diffing.
          - **Single Syscall Frame Rendering (`Writer`):** Pre-allocated I/O buffer flushes entire screen frames in a single `write(2)` system call.
          - **OS Abstractions (`internal/platform`):** Cross-platform raw terminal mode, termios/ioctl controls, window size caching, and SIGWINCH signal handling without high-level framework dependencies.
          - **Terminal Capabilities (`Caps`):** Automated terminal capability discovery supporting environment checks and active DECRQM queries.

          ---

          ### 🌐 Multilingual Documentation

          - 🇬🇧 [English Documentation](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/docs/en)
          - 🇷🇺 [Русская документация](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/docs/ru)
          - 🇨🇳 [中文文档](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/docs/zh)

          ---

          *Built with precision by the Fluint team. For issues or contributions, visit the [Fluint Repository](https://github.com/${{ github.repository }}).*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fluint ${{ github.ref_name }}
          body_path: FULL_RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
